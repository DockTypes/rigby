name: rigby
description: "Rigby - AI Voice Assistant pentru Studenti"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  path_drawing: ^1.0.1
  http: ^1.2.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0
  flutter_overlay_window: ^0.4.0
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^17.1.1
  timezone: ^0.9.4
  workmanager: ^0.9.0+3
  html: ^0.15.4
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/rag/
    - lib/assets/logo.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#060606"
  image: "assets/images/logo_splash.png"
  android: true
  ios: true
  android_12:
    color: "#060606"
    image: "assets/images/logo_splash.png"
